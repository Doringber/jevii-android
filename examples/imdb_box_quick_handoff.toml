name = "IMDb movie search survives a Box app interruption"
story = """
Open IMDb.
If visible, tap "NOT NOW".
If visible, tap "Skip rating".
Search for "The Martian".
Open the 2015 movie title.
Switch to Box.
Return to IMDb.
Verify the screen shows "The Martian".
"""

[apps.IMDb]
package = "com.imdb.mobile"
activity = ".HomeActivity"
search_text = "Search for shows, movies, people…"

[apps.Box]
package = "com.box.gallery"
activity = ".MainActivity"
